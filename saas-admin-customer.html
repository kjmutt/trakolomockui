<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trakolo — customer profile</title>
<link rel="stylesheet" href="styles.css">
<style>
  .plat-wrap{max-width:1080px;margin:0 auto;padding:32px 40px 60px;}
  .plat-card{background:#151F1B;border:1px solid #26362F;border-radius:14px;padding:20px 22px;}
  .cust-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .cust-name{font-family:var(--font-display);font-size:24px;font-weight:700;color:#fff;}
  .cust-meta{font-size:12.5px;color:#8FA79C;margin-top:6px;}
  .edition-pill{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;background:#1B2E27;color:#5DCAA5;border:1px solid #2E4A3E;white-space:nowrap;}
  .edition-pill.free{background:#26362F;color:#8FA79C;border-color:#37473F;}
  .edition-pill.enterprise{background:#2A2338;color:#B9A8ED;border-color:#453A61;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  @media (max-width:800px){.two-col{grid-template-columns:1fr;}}
  .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #1E2B25;gap:12px;font-size:12.5px;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:#7C948A;}
  .kv .v{color:#EAF2ED;text-align:right;}
  .section-title{font-family:var(--font-display);font-size:15px;font-weight:700;color:#fff;margin:22px 0 10px;}
  .ent-col-label{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:#7C948A;font-family:var(--font-mono);font-weight:600;padding:8px 0 4px;border-bottom:1px solid #26362F;}
  .ent-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #1E2B25;gap:12px;font-size:12.5px;}
  .ent-row:last-child{border-bottom:none;}
  .ent-name{color:#D6E4DE;}
  .ent-note{font-size:11px;color:#7C948A;margin-top:1px;}
  .ent-yes{color:#5DCAA5;font-size:11.5px;font-weight:600;}
  .ent-no{color:#5C7268;font-size:11.5px;}
  .action-bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;}
  .not-found{padding:60px 0;text-align:center;color:#8FA79C;}
</style>
</head>

  },

    products: [
      ['Service desk (ITSM)', 'In license', true],

    ],

      ['AI Agent — Coding', 'Not in their license', false],

  },
  'Initech': {

function esc(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function render(){
  const org = new URLSearchParams(location.search).get('org') || 'Acme Corp';
  const c = CUSTOMERS[org];
  const root = document.getElementById('profile-root');
  if(!c){
    root.innerHTML = '<div class="not-found">No customer profile found for "' + esc(org) + '". <a href="saas-admin-console.html" style="color:#5DCAA5;">Back to Home →</a></div>';
    return;
  }
  const rowsHtml = (rows) => rows.map(([name, note, on]) =>
    '<div class="ent-row"><div><div class="ent-name">'+esc(name)+'</div>'+(note?'<div class="ent-note">'+esc(note)+'</div>':'')+'</div><span class="'+(on?'ent-yes':'ent-no')+'">'+(on?'✓ Included':'Not included')+'</span></div>'
  ).join('');

  root.innerHTML =
    '<div class="cust-head">' +
      '<div><div class="cust-name">'+esc(org)+'</div><div class="cust-meta">'+esc(c.deployment)+' · '+c.sub.licenses.toLocaleString()+' seats · customer since '+esc(c.since)+'</div></div>' +
      '<span class="edition-pill '+c.editionClass+'">'+esc(c.edition)+' edition</span>' +
    '</div>' +
    '<div class="two-col">' +
      '<div class="plat-card">' +
        '<div class="section-title" style="margin-top:0;">Primary contact</div>' +
        '<div class="kv"><span class="k">Name</span><span class="v">'+esc(c.contact.name)+'</span></div>' +
        '<div class="kv"><span class="k">Title</span><span class="v">'+esc(c.contact.title)+'</span></div>' +
        '<div class="kv"><span class="k">Email</span><span class="v id-mono">'+esc(c.contact.email)+'</span></div>' +
        '<div class="kv"><span class="k">Phone</span><span class="v id-mono">'+esc(c.contact.phone)+'</span></div>' +
      '</div>' +
      '<div class="plat-card">' +
        '<div class="section-title" style="margin-top:0;">Subscription</div>' +
        '<div class="kv"><span class="k">Type</span><span class="v">'+esc(c.sub.type)+'</span></div>' +
        '<div class="kv"><span class="k">Contract</span><span class="v">'+esc(c.sub.from)+' → '+esc(c.sub.to)+'</span></div>' +
        '<div class="kv"><span class="k">Drop dead date</span><span class="v">'+esc(c.sub.dropDead)+'</span></div>' +
        '<div class="kv"><span class="k">License key</span><span class="v id-mono">'+esc(c.sub.key)+'</span></div>' +
        '<div class="kv"><span class="k">Billing</span><span class="v">'+esc(c.sub.billing)+'</span></div>' +
      '</div>' +
    '</div>' +
    '<div class="plat-card">' +
      '<div class="two-col" style="margin-bottom:0;">' +
        '<div><div class="ent-col-label">Products bought</div>'+rowsHtml(c.products)+'</div>' +
        '<div><div class="ent-col-label">Feature flags</div>'+rowsHtml(c.features)+'</div>' +
      '</div>' +
    '</div>' +
    '<div class="action-bar">' +
      '<a class="btn primary" style="background:#1D9E75;border-color:#1D9E75;" href="saas-admin-console.html">Manage renewal / upgrade →</a>' +
      '<a class="btn sm" style="background:#1B2620;border-color:#2B3B33;color:#D6E4DE;" href="saas-admin-plans.html">Edit entitlements →</a>' +
      '<a class="btn sm" style="background:#1B2620;border-color:#2B3B33;color:#D6E4DE;" href="saas-admin-campaigns.html?org='+encodeURIComponent(org)+'">Send promotional email →</a>' +
      '<a class="btn sm" style="background:#1B2620;border-color:#2B3B33;color:#D6E4DE;" href="saas-admin-errorlog.html?org='+encodeURIComponent(org)+'">View error log →</a>' +

}
render();
</script>
