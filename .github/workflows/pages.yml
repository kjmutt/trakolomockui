name: Deploy to GitHub Pages

# The mockup is static HTML with no build step, so this publishes the
# repository as-is. db/, install/ and openapi/ are published alongside the
# pages because sitemap.html links directly to those files.
#
# Split into two jobs on purpose. The `environment: github-pages` gate is
# evaluated before a job starts, so anything that enables Pages has to run
# in a job that doesn't declare it — otherwise the enablement step can
# never run to unblock the very job it's gating.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-applied
# deploy is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # upload-pages-artifact excludes .git and .github itself.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
